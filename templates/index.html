<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandatraders Pro Terminal</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --accent-red: #da3633;
            --accent-blue: #1f6feb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 10px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .logo {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 11px;
            color: #3fb950;
            background: rgba(63, 185, 80, 0.1);
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid rgba(63, 185, 80, 0.3);
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        /* Таймфрейми */
        .timeframes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .tf-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 2px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .tf-btn.active {
            background: var(--accent-green);
            border-color: #2ea043;
            color: #fff;
        }

        /* Кнопка запиту */
        .action-btn {
            width: 100%;
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(35, 134, 54, 0.3);
        }

        .action-btn:hover {
            background: var(--accent-green-hover);
        }

        /* Блок аналізу */
        .analysis-box {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
        }

        .signal-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
        }

        .analysis-details {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Сітка активів — робимо компактною для всіх пар */
        .assets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            max-height: 160px;
            overflow-y: auto;
        }

        .asset-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 4px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .asset-btn.active {
            background: var(--accent-green);
            border-color: #2ea043;
            color: #fff;
        }

        /* Нижня панель навігації */
        nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: auto;
        }

        .nav-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .nav-btn.active {
            background: var(--accent-green);
            border-color: #2ea043;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐼 PANDATRADERS PRO</div>
        <div class="status-badge" id="connStatus">● Готовий</div>
    </header>

    <!-- Час експірації -->
    <div class="card">
        <div class="section-title">Час експірації</div>
        <div class="timeframes-grid" id="tfContainer">
            <button class="tf-btn" onclick="setExpiry('1 хв')">1 хв</button>
            <button class="tf-btn active" onclick="setExpiry('5 хв')">5 хв</button>
            <button class="tf-btn" onclick="setExpiry('15 хв')">15 хв</button>
            <button class="tf-btn" onclick="setExpiry('30 хв')">30 хв</button>
            <button class="tf-btn" onclick="setExpiry('1 год')">1 год</button>
        </div>
    </div>

    <!-- Кнопка отримання сигналу -->
    <button class="action-btn" onclick="fetchSignal()">🔍 Отримати мульті-аналіз</button>

    <!-- Глибокий аналіз активу -->
    <div class="card">
        <div class="section-title" id="activeTitle">Глибокий аналіз активу (GBPUSD)</div>
        <div class="analysis-box">
            <div class="signal-title" id="signalOutput">⏳ Натисніть кнопку для аналізу...</div>
            <div class="analysis-details" id="detailsOutput">Виберіть актив та натисніть отримання сигналу для перевірки ринку.</div>
        </div>
    </div>

    <!-- Вибір активу -->
    <div class="card">
        <div class="section-title">Оберіть актив</div>
        <div class="assets-grid" id="assetsContainer">
            <button class="asset-btn active" onclick="setAsset('GBPUSD')">GBPUSD</button>
            <button class="asset-btn" onclick="setAsset('EURUSD')">EURUSD</button>
            <button class="asset-btn" onclick="setAsset('USDJPY')">USDJPY</button>
            <button class="asset-btn" onclick="setAsset('AUDUSD')">AUDUSD</button>
            <button class="asset-btn" onclick="setAsset('USDCAD')">USDCAD</button>
            <button class="asset-btn" onclick="setAsset('USDCHF')">USDCHF</button>
            <button class="asset-btn" onclick="setAsset('NZDUSD')">NZDUSD</button>
            <button class="asset-btn" onclick="setAsset('EURGBP')">EURGBP</button>
            <button class="asset-btn" onclick="setAsset('EURJPY')">EURJPY</button>
            <button class="asset-btn" onclick="setAsset('CHFJPY')">CHFJPY</button>
            <button class="asset-btn" onclick="setAsset('GBPCHF')">GBPCHF</button>
            <button class="asset-btn" onclick="setAsset('XAUUSD')">XAUUSD</button>
        </div>
    </div>

    <!-- Навігація -->
    <nav>
        <button class="nav-btn active">📊 Торгівля</button>
        <button class="nav-btn" onclick="alert('Статистика сесії оновлюється автоматично в базі даних.')">📈 Статистика</button>
    </nav>

    <script>
        let currentSymbol = 'GBPUSD';
        let currentExpiry = '5 хв';

        function setExpiry(tf) {
            currentExpiry = tf;
            document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function setAsset(symbol) {
            currentSymbol = symbol;
            document.querySelectorAll('.asset-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('activeTitle').innerText = `Глибокий аналіз активу (${symbol})`;
            fetchSignal();
        }

        async function fetchSignal() {
            const signalEl = document.getElementById('signalOutput');
            const detailsEl = document.getElementById('detailsOutput');
            const statusEl = document.getElementById('connStatus');

            signalEl.innerHTML = "⏳ Аналізуємо ринок...";
            detailsEl.innerHTML = `Збираємо показники по ${currentSymbol} на таймфреймі ${currentExpiry}...`;
            statusEl.innerText = "● Аналіз...";
            statusEl.style.color = "#d29922";

            try {
                const response = await fetch('/api/signal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol: currentSymbol, expiry: currentExpiry })
                });

                const data = await response.json();
                signalEl.innerHTML = data.signal;
                detailsEl.innerHTML = `${data.details} (Ціна: ${data.price})`;
                
                statusEl.innerText = "● Готовий";
                statusEl.style.color = "#3fb950";
            } catch (error) {
                signalEl.innerHTML = "⚠️ ПОМИЛКА ШЛЮЗУ";
                detailsEl.innerHTML = "Не вдалося отримати відповідь від сервера. Спробуйте ще раз.";
                statusEl.innerText = "● Збій";
                statusEl.style.color = "#da3633";
            }
        }
    </script>
</body>
</html>
