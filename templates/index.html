<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandatraders Pro Terminal</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --accent-red: #da3633;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 10px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .logo {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 11px;
            color: #3fb950;
            background: rgba(63, 185, 80, 0.1);
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid rgba(63, 185, 80, 0.3);
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .market-status-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .market-status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #3fb950;
            font-weight: 600;
        }

        /* 4 кнопки замість 5 (без 1 хв) */
        .timeframes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .tf-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 4px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .tf-btn.active {
            background: var(--accent-green);
            border-color: #2ea043;
            color: #fff;
        }

        .action-btn {
            width: 100%;
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(35, 134, 54, 0.3);
        }

        .action-btn:hover {
            background: var(--accent-green-hover);
        }

        .analysis-box {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            min-height: 85px;
        }

        .signal-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .analysis-details {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .assets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .asset-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 6px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
        }

        .asset-btn.active {
            background: var(--accent-green);
            border-color: #2ea043;
            color: #fff;
        }

        nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: auto;
            padding-top: 4px;
        }

        .nav-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .nav-btn.active {
            background: var(--accent-green);
            border-color: #2ea043;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐼 PANDATRADERS PRO</div>
        <div class="status-badge" id="connStatus">● MULTI-TA</div>
    </header>

    <div class="market-status-box">
        <span style="color: var(--text-muted); font-size: 11px;">📊 Статус ринку:</span>
        <div class="market-status-indicator" id="marketStatusText">
            <span>●</span> Готовий до роботи
        </div>
    </div>

    <!-- Час експірації (без 1 хв) -->
    <div class="card">
        <div class="section-title">Час експірації</div>
        <div class="timeframes-grid" id="tfContainer">
            <button class="tf-btn active" onclick="setExpiry('5 хв')">5 хв</button>
            <button class="tf-btn" onclick="setExpiry('15 хв')">15 хв</button>
            <button class="tf-btn" onclick="setExpiry('30 хв')">30 хв</button>
            <button class="tf-btn" onclick="setExpiry('1 год')">1 год</button>
        </div>
    </div>

    <button class="action-btn" onclick="fetchSignal()">🔍 Отримати мульті-аналіз</button>

    <div class="card">
        <div class="section-title" id="activeTitle">Глибокий аналіз активу (GBPUSD)</div>
        <div class="analysis-box">
            <div class="signal-title" id="signalOutput">⏳ Очікування вибору...</div>
            <div class="analysis-details" id="detailsOutput">Оберіть час експірації, пару та натисніть кнопку «Отримати мульті-аналіз».</div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">
            <span>Оберіть актив (19 пар)</span>
        </div>
        <div class="assets-grid" id="assetsContainer">
            <button class="asset-btn active" onclick="setAsset('GBPUSD')">GBPUSD</button>
            <button class="asset-btn" onclick="setAsset('EURUSD')">EURUSD</button>
            <button class="asset-btn" onclick="setAsset('USDJPY')">USDJPY</button>
            <button class="asset-btn" onclick="setAsset('AUDUSD')">AUDUSD</button>
            <button class="asset-btn" onclick="setAsset('USDCAD')">USDCAD</button>
            <button class="asset-btn" onclick="setAsset('USDCHF')">USDCHF</button>
            <button class="asset-btn" onclick="setAsset('NZDUSD')">NZDUSD</button>
            <button class="asset-btn" onclick="setAsset('EURGBP')">EURGBP</button>
            <button class="asset-btn" onclick="setAsset('EURJPY')">EURJPY</button>
            <button class="asset-btn" onclick="setAsset('GBPAUD')">GBPAUD</button>
            <button class="asset-btn" onclick="setAsset('CHFJPY')">CHFJPY</button>
            <button class="asset-btn" onclick="setAsset('GBPCHF')">GBPCHF</button>
            <button class="asset-btn" onclick="setAsset('AUDJPY')">AUDJPY</button>
            <button class="asset-btn" onclick="setAsset('AUDCHF')">AUDCHF</button>
            <button class="asset-btn" onclick="setAsset('EURCHF')">EURCHF</button>
            <button class="asset-btn" onclick="setAsset('AUDCAD')">AUDCAD</button>
            <button class="asset-btn" onclick="setAsset('CADJPY')">CADJPY</button>
            <button class="asset-btn" onclick="setAsset('CADCHF')">CADCHF</button>
            <button class="asset-btn" onclick="setAsset('GBPCAD')">GBPCAD</button>
        </div>
    </div>

    <nav>
        <button class="nav-btn active">📊 Торгівля</button>
        <button class="nav-btn" onclick="alert('Статистика сесії оновлюється автоматично в базі даних.')">📈 Статистика</button>
    </nav>

    <script>
        let currentSymbol = 'GBPUSD';
        let currentExpiry = '5 хв'; // За дефолтом одразу 5 хв

        function setExpiry(tf) {
            currentExpiry = tf;
            document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function setAsset(symbol) {
            currentSymbol = symbol;
            document.querySelectorAll('.asset-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('activeTitle').innerText = `Глибокий аналіз активу (${symbol})`;
        }

        async function fetchSignal() {
            const signalEl = document.getElementById('signalOutput');
            const detailsEl = document.getElementById('detailsOutput');
            const statusIndicator = document.getElementById('marketStatusText');

            signalEl.innerHTML = "⏳ Аналізуємо ринок...";
            detailsEl.innerHTML = `Збираємо показники по ${currentSymbol} на таймфреймі ${currentExpiry}...`;
            statusIndicator.innerHTML = '<span style="color: #d29922;">●</span> Аналіз ринку...';

            try {
                const response = await fetch('/api/signal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol: currentSymbol, expiry: currentExpiry })
                });

                const data = await response.json();
                signalEl.innerHTML = data.signal;
                detailsEl.innerHTML = `${data.details} (Ціна: ${data.price})`;
                
                statusIndicator.innerHTML = '<span style="color: #3fb950;">●</span> Готовий до роботи';
            } catch (error) {
                signalEl.innerHTML = "⚠️ ПОМИЛКА АНАЛІЗУ";
                detailsEl.innerHTML = "Не вдалося отримати відповідь від сервера. Спробуйте ще раз.";
                statusIndicator.innerHTML = '<span style="color: #da3633;">●</span> Збій зв’язку';
            }
        }
    </script>
</body>
</html>
